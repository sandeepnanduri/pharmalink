<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#4F46E5;--pl:#6366F1;--pale:#EEF2FF;--mid:#C7D2FE;--dh:#1E1B4B;
  --acc:#06B6D4;--dk:#0F172A;--sl:#334155;--mu:#64748B;--bd:#E2E8F0;--of:#F8FAFC;
  --gn:#16A34A;--gnl:#DCFCE7;--am:#D97706;--aml:#FEF3C7;--rd:#DC2626;--rdl:#FEE2E2;
  --nav-w:236px;--radius:12px;
}
html{color-scheme:light}
html,body{height:100%;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--of);color:var(--dk);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.syne{font-family:'Syne',sans-serif}
.mono{font-family:'DM Mono',monospace}
a{color:inherit;text-decoration:none}
button{font-family:'DM Sans',sans-serif;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px}::-webkit-scrollbar-track{background:transparent}

/* ── SHELL ─────────────────────────────── */
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{height:52px;background:linear-gradient(135deg,var(--dh),#2D2B55);display:flex;align-items:center;padding:0 18px;gap:14px;flex-shrink:0;z-index:100;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{display:flex;align-items:center;gap:9px;border-right:1px solid rgba(255,255,255,.12);padding-right:16px}
.mark{width:30px;height:30px;background:linear-gradient(135deg,var(--p),var(--acc));border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Syne';font-weight:800;font-size:13px;color:#fff}
.brand{font-family:'Syne';font-weight:700;font-size:15px;color:#fff}.brand span{color:var(--acc)}
.pill{font-size:9px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(6,182,212,.18);border:1px solid rgba(6,182,212,.35);color:#67E8F9;letter-spacing:.5px}
.screen-crumb{font-size:12px;color:rgba(255,255,255,.45);font-weight:500}
.screen-crumb b{color:#fff;font-family:'Syne';font-weight:700;margin-left:2px}
.roles{margin-left:auto;display:flex;gap:5px;background:rgba(0,0,0,.2);padding:4px;border-radius:10px}
.role-btn{padding:6px 13px;border-radius:7px;font-size:12px;font-weight:600;border:none;background:transparent;color:rgba(255,255,255,.6);transition:.15s}
.role-btn:hover{color:#fff}
.role-btn.active{background:var(--p);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.5)}
.topbar-user{display:flex;align-items:center;gap:8px;padding-left:6px}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#818CF8,#22D3EE);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}

.body-area{display:flex;flex:1;overflow:hidden}
.sidenav{width:var(--nav-w);flex-shrink:0;background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow-y:auto;padding:14px 10px}
.nav-role-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--mu);padding:6px 10px 10px}
.nav-group-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:#94A3B8;padding:14px 10px 6px}
.nav-btn{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;border:none;background:transparent;width:100%;text-align:left;color:var(--sl);font-size:13px;font-weight:500;transition:.12s;margin-bottom:1px}
.nav-btn:hover{background:var(--of)}
.nav-btn.active{background:var(--pale);color:var(--p);font-weight:600}
.nav-btn .ic{font-size:16px;width:20px;text-align:center}
.nav-btn .badge-n{margin-left:auto;background:var(--rd);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.nav-cta{margin:14px 10px 4px;padding:11px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--pl));color:#fff;border:none;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 4px 14px rgba(79,70,229,.3)}
.nav-note{margin:auto 10px 4px;font-size:10.5px;color:var(--mu);background:var(--of);border:1px solid var(--bd);border-radius:9px;padding:9px 11px;line-height:1.5}

.main{flex:1;overflow-y:auto;background:var(--of)}
.page{max-width:1180px;margin:0 auto;padding:28px 32px 60px}

/* ── COMPONENTS ─────────────────────────── */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.5px}
.page-sub{font-size:13.5px;color:var(--mu);margin-top:4px;max-width:640px;line-height:1.5}
.btn{padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid transparent;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn-primary{background:var(--p);color:#fff}.btn-primary:hover{background:#4338CA;transform:translateY(-1px);box-shadow:0 4px 14px rgba(79,70,229,.35)}
.btn-ghost{background:#fff;color:var(--sl);border-color:var(--bd)}.btn-ghost:hover{border-color:var(--mid);background:var(--pale)}
.btn-accent{background:var(--acc);color:#fff}.btn-accent:hover{background:#0891B2}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--radius);padding:20px}
.card-pad0{background:#fff;border:1px solid var(--bd);border-radius:var(--radius);overflow:hidden}
.grid{display:grid;gap:16px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.b-verified{background:var(--gnl);color:#15803D}
.b-pending{background:var(--aml);color:#B45309}
.b-rejected{background:var(--rdl);color:#B91C1C}
.b-info{background:var(--pale);color:var(--p)}
.b-neutral{background:#F1F5F9;color:var(--sl)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:8px;background:var(--of);border:1px solid var(--bd);color:var(--sl)}
.chip .exp{color:var(--mu);font-weight:500;font-size:10.5px}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:var(--radius);padding:16px 18px}
.kpi .lbl{font-size:11.5px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}
.kpi .val{font-size:28px;font-weight:800;margin-top:6px;font-family:'Syne'}
.kpi .delta{font-size:11.5px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:4px}
.up{color:var(--gn)}.down{color:var(--rd)}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--of)}
.tbl td{padding:13px 16px;border-bottom:1px solid #F1F5F9;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click:hover{background:var(--pale);cursor:pointer}
.tbl .sub{font-size:11.5px;color:var(--mu)}

.section-title{font-size:15px;font-weight:700;font-family:'Syne';margin-bottom:12px;display:flex;align-items:center;gap:8px}
.link{color:var(--p);font-weight:600;font-size:13px}.link:hover{text-decoration:underline}
.divide{height:1px;background:var(--bd);margin:18px 0}

/* stepper */
.stepper{display:flex;align-items:center;margin-bottom:26px}
.step{display:flex;align-items:center;gap:10px;flex:1}
.step .num{width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--bd);color:var(--mu);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.step .stxt{font-size:12px;font-weight:600;color:var(--mu)}
.step.done .num{background:var(--gn);border-color:var(--gn);color:#fff}
.step.active .num{background:var(--p);border-color:var(--p);color:#fff;box-shadow:0 0 0 4px var(--pale)}
.step.active .stxt{color:var(--p)}
.step .line{flex:1;height:2px;background:var(--bd);margin:0 4px}
.step.done .line{background:var(--gn)}

/* form */
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--sl)}
.field .hint{font-size:11px;color:var(--mu);font-weight:400;margin-left:4px}
.input,.select,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:9px;font-size:13px;font-family:'DM Sans';background:#fff;color:var(--dk)}
.input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px var(--pale)}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dropzone{border:2px dashed var(--mid);border-radius:11px;padding:22px;text-align:center;color:var(--mu);font-size:13px;background:var(--pale)}
.wizard-actions{display:flex;justify-content:space-between;margin-top:24px;padding-top:20px;border-top:1px solid var(--bd)}

/* filter sidebar (catalog) */
.catalog{display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start}
.filters{background:#fff;border:1px solid var(--bd);border-radius:var(--radius);padding:18px;position:sticky;top:0}
.filter-group{padding:12px 0;border-bottom:1px solid #F1F5F9}
.filter-group:last-child{border-bottom:none}
.filter-group h5{font-size:12px;font-weight:700;margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--sl)}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sl);padding:4px 0;cursor:pointer}
.check input{accent-color:var(--p);width:15px;height:15px}
.result-card{background:#fff;border:1px solid var(--bd);border-radius:var(--radius);padding:16px;display:flex;gap:14px;transition:.15s;cursor:pointer}
.result-card:hover{border-color:var(--mid);box-shadow:0 6px 20px rgba(15,23,42,.06);transform:translateY(-1px)}
.sup-logo{width:52px;height:52px;border-radius:11px;background:linear-gradient(135deg,var(--pale),var(--mid));display:flex;align-items:center;justify-content:center;font-family:'Syne';font-weight:800;color:var(--p);font-size:18px;flex-shrink:0}

.searchbar{display:flex;gap:10px;margin-bottom:20px}
.searchbar .input{flex:1}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.count{font-size:13px;color:var(--mu)}.count b{color:var(--dk)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:20px}
.tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--mu);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--p);border-bottom-color:var(--p)}
.tab:hover:not(.active){color:var(--sl)}

/* hero */
.hero{background:linear-gradient(135deg,var(--dh),#312E81 60%,#1E3A8A);border-radius:18px;padding:44px 40px;color:#fff;position:relative;overflow:hidden;margin-bottom:26px}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:300px;height:300px;background:radial-gradient(circle,rgba(6,182,212,.25),transparent 70%)}
.hero h1{font-size:34px;font-weight:800;letter-spacing:-1px;max-width:640px;line-height:1.15}
.hero p{font-size:15px;color:rgba(255,255,255,.8);max-width:560px;margin-top:14px;line-height:1.6}
.hero .cta-row{display:flex;gap:12px;margin-top:24px}
.hero-search{margin-top:26px;background:#fff;border-radius:12px;padding:6px;display:flex;gap:6px;max-width:600px}
.hero-search input{flex:1;border:none;padding:12px 14px;font-size:14px;font-family:'DM Sans';border-radius:8px}
.hero-search input:focus{outline:none}
.cat-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.cat-tile{background:#fff;border:1px solid var(--bd);border-radius:var(--radius);padding:18px;transition:.15s;cursor:pointer}
.cat-tile:hover{border-color:var(--p);transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,23,42,.07)}
.cat-tile .ci{font-size:26px}
.cat-tile h4{font-size:15px;margin-top:10px}
.cat-tile .c{font-size:12px;color:var(--mu);margin-top:3px}
.steps-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.hstep{text-align:center;padding:8px}
.hstep .hn{width:44px;height:44px;border-radius:50%;background:var(--pale);color:var(--p);font-family:'Syne';font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}

.alert{display:flex;gap:12px;padding:14px 16px;border-radius:11px;font-size:13px;align-items:flex-start}
.alert-info{background:var(--pale);color:#3730A3;border:1px solid var(--mid)}
.alert-warn{background:var(--aml);color:#92400E;border:1px solid #FCD34D}
.alert .ai{font-size:18px;line-height:1}

.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--bd)}
.tl-item{position:relative;padding-bottom:18px}
.tl-item::before{content:'';position:absolute;left:-24px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--mid)}
.tl-item.done::before{background:var(--gn);border-color:var(--gn)}
.tl-item.active::before{background:var(--p);border-color:var(--p);box-shadow:0 0 0 4px var(--pale)}
.tl-item .tt{font-size:13px;font-weight:600}
.tl-item .td{font-size:11.5px;color:var(--mu);margin-top:2px}

/* thread */
.msg{max-width:74%;padding:11px 14px;border-radius:12px;font-size:13px;line-height:1.5;margin-bottom:12px}
.msg .who{font-size:11px;font-weight:700;margin-bottom:4px;opacity:.75}
.msg.them{background:#fff;border:1px solid var(--bd);border-top-left-radius:3px}
.msg.me{background:var(--p);color:#fff;margin-left:auto;border-top-right-radius:3px}
.msg.me .who{color:rgba(255,255,255,.8)}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.3);max-height:90vh;overflow-y:auto}
.modal h3{font-size:19px;font-weight:800}
.modal .x{float:right;font-size:22px;color:var(--mu);background:none;border:none;line-height:1}

.compare-tbl th:first-child,.compare-tbl td:first-child{position:sticky;left:0;background:var(--of);z-index:1;font-weight:600;color:var(--sl)}
.best{background:var(--gnl)!important;position:relative}
.best-tag{font-size:9px;font-weight:800;color:var(--gn);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:2px}

.empty{text-align:center;padding:50px 20px;color:var(--mu)}
.empty .ei{font-size:40px;margin-bottom:12px;opacity:.5}

#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--dk);color:#fff;padding:13px 20px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* workflows */
.wf-actor{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;white-space:nowrap}
.wf-actor .d{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.wf-legend{display:flex;gap:8px;flex-wrap:wrap}
.wf-flow{display:flex;flex-direction:column}
.wf-step{display:flex;gap:14px;position:relative;padding-bottom:12px}
.wf-step:not(:last-child)::before{content:'';position:absolute;left:19px;top:42px;bottom:0;width:2px;background:var(--bd)}
.wf-num{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Syne',sans-serif;font-size:15px;z-index:1}
.wf-card{flex:1;background:#fff;border:1px solid var(--bd);border-left-width:3px;border-radius:11px;padding:11px 15px}
.wf-card .wf-role{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.wf-card .wf-act{font-size:13.5px;font-weight:700;margin:2px 0 3px}
.wf-card .wf-out{font-size:12px;color:var(--mu);line-height:1.5}
.wf-outcome{display:flex;gap:12px;align-items:center;background:var(--gnl);border:1px solid #86EFAC;border-radius:12px;padding:14px 16px;margin-top:10px}

/* architecture */
.arch-layer{border:1px solid var(--bd);border-radius:12px;padding:13px 15px;background:#fff}
.arch-lbl{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);margin-bottom:9px}
.arch-boxes{display:flex;gap:9px;flex-wrap:wrap}
.arch-box{flex:1;min-width:120px;background:var(--of);border:1px solid var(--bd);border-radius:9px;padding:10px 12px}
.arch-box b{font-size:12.5px;display:block}
.arch-box .s{font-size:10.5px;color:var(--mu);margin-top:2px;line-height:1.45}
.arch-arrow{text-align:center;color:#94A3B8;font-size:13px;margin:4px 0;font-weight:700}
.arch-bus{background:linear-gradient(135deg,#EDE9FE,#EEF2FF);border-color:var(--mid)}
.arch-bus .arch-box{background:#fff;border-color:var(--mid)}

/* cookie consent */
#cookie{position:fixed;left:16px;right:16px;bottom:16px;max-width:560px;margin:0 auto;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 18px 44px rgba(15,23,42,.22);padding:16px 18px;z-index:250;display:none}
#cookie.show{display:block}
#cookie h4{font-size:14px;margin-bottom:5px}
#cookie p{font-size:12px;color:var(--mu);line-height:1.55}
#cookie .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}

.two-col{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
.mini-list{display:flex;flex-direction:column;gap:2px}
.mini-item{display:flex;align-items:center;gap:11px;padding:10px;border-radius:9px}
.mini-item:hover{background:var(--of)}
.mini-item .mt{font-size:12.5px;font-weight:600}
.mini-item .ms{font-size:11px;color:var(--mu)}

.progress{height:7px;background:#F1F5F9;border-radius:6px;overflow:hidden}
.progress .bar{height:100%;background:linear-gradient(90deg,var(--p),var(--acc));border-radius:6px}

@media(max-width:860px){
  .catalog,.two-col{grid-template-columns:1fr}
  .form-2{grid-template-columns:1fr}
  .roles{display:none}
}
</style>


<div class="shell">
  <div class="topbar">
    <div class="logo">
      <div class="mark">PL</div>
      <div class="brand">Pharma<span>Link</span></div>
    </div>
    <span class="pill">MVP MOCK · v0.1</span>
    <span class="screen-crumb" id="crumb">Public site<b>Home</b></span>
    <div class="roles" id="roleSwitch">
      <button class="role-btn active" data-role="public">Public</button>
      <button class="role-btn" data-role="buyer">Buyer</button>
      <button class="role-btn" data-role="seller">Seller</button>
      <button class="role-btn" data-role="admin">Ops / Admin</button>
      <button class="role-btn" data-role="wf" style="color:#FBBF24">Workflows</button>
      <button class="role-btn" data-role="arch" style="color:#5EEAD4">Architecture</button>
      <button class="role-btn" data-role="roadmap" style="color:#67E8F9">Roadmap ›</button>
    </div>
    <div class="topbar-user">
      <div class="avatar" id="avatar">RM</div>
    </div>
  </div>
  <div class="body-area">
    <nav class="sidenav" id="sidenav"></nav>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal" id="modalBody"></div>
</div>
<div id="toast"></div>
<div id="cookie">
  <h4>🍪 Your privacy</h4>
  <p>We use essential cookies to run PharmaLink and, with your consent, analytics to improve it. Auth tokens are stored in <b>HttpOnly, Secure</b> cookies — never readable by scripts. See <b>Architecture → Sessions &amp; JWT</b>.</p>
  <div class="row">
    <button class="btn btn-primary btn-sm" onclick="consent('all')">Accept all</button>
    <button class="btn btn-ghost btn-sm" onclick="consent('essential')">Essential only</button>
    <span class="link" style="font-size:12px" data-nav="arch/compliance">Privacy details</span>
  </div>
</div>

<script>

const el = h => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };
function badge(type,txt){const m={verified:'b-verified',pending:'b-pending',rejected:'b-rejected',info:'b-info',neutral:'b-neutral'};return `<span class="badge ${m[type]||'b-neutral'}">${txt}</span>`;}
function statusBadge(s){const m={Quoted:['info','● Quoted'],Open:['pending','● Open'],Accepted:['verified','✓ Accepted'],Expired:['neutral','Expired'],Draft:['neutral','Draft'],Closed:['neutral','Closed']};const [t,l]=m[s]||['neutral',s];return badge(t,l);}
function certChip(name,exp){const expd = exp==='pending'? '<span class="exp" style="color:var(--am)">pending</span>' : `<span class="exp">exp ${exp}</span>`;return `<span class="chip">🛡️ ${name} ${expd}</span>`;}
function kpi(lbl,val,delta,dir){const d=delta?`<div class="delta ${dir}">${dir==='up'?'▲':dir==='down'?'▼':''} ${delta}</div>`:'';return `<div class="kpi"><div class="lbl">${lbl}</div><div class="val">${val}</div>${d}</div>`;}
function pageHead(title,sub,actions=''){return `<div class="page-head"><div><div class="page-title">${title}</div>${sub?`<div class="page-sub">${sub}</div>`:''}</div><div style="display:flex;gap:10px">${actions}</div></div>`;}

function filterProducts(){
  const q = (document.getElementById('catSearch')?.value || '').trim().toLowerCase();
  const cats = [...document.querySelectorAll('[data-cat]:checked')].map(c=>c.dataset.cat);
  const certs = [...document.querySelectorAll('[data-cert]:checked')].map(c=>c.dataset.cert);
  const countries = [...document.querySelectorAll('[data-country]:checked')].map(c=>c.dataset.country);
  const moqCap = moqNum(document.querySelector('[data-moq]:checked')?.dataset.moq || '1000000000');
  return PRODUCTS.filter(p=>{
    const s = sup(p.supId);
    if(q && !(p.name.toLowerCase().includes(q) || p.cas.includes(q))) return false;
    if(cats.length && !cats.includes(p.cat)) return false;
    if(certs.length && !certs.every(c=> s.certs.some(sc=>sc[0]===c))) return false; // must hold ALL selected certs
    if(countries.length && !countries.includes(s.country)) return false;
    if(moqNum(p.moq) > moqCap) return false;
    return true;
  });
}
function applyCatalogFilters(){
  const list = filterProducts();
  const res = document.getElementById('catResults');
  const cnt = document.getElementById('catCount');
  if(!res) return;
  res.innerHTML = list.length ? list.map(catalogCard).join('') : `<div class="empty"><div class="ei">🔍</div>No products match these filters.<br><span class="sub">Try removing a certification requirement or broadening the category.</span></div>`;
  if(cnt) cnt.innerHTML = `<b>${list.length}</b> product${list.length===1?'':'s'} from <b>${new Set(list.map(p=>p.supId)).size}</b> verified supplier${new Set(list.map(p=>p.supId)).size===1?'':'s'}`;
}

function areaChart(data){
  const w=560,h=150,pad=8,baseY=h-pad;
  const max=Math.max(...data),min=Math.min(...data),rng=(max-min)||1;
  const sx=(w-pad*2)/(data.length-1);
  const pts=data.map((v,i)=>[pad+i*sx, pad+(h-pad*2)*(1-(v-min)/rng)]);
  const line=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const area=`${line} L ${pts[pts.length-1][0].toFixed(1)} ${baseY} L ${pts[0][0].toFixed(1)} ${baseY} Z`;
  const last=pts[pts.length-1];
  const grid=[0.33,0.66].map(f=>`<line x1="${pad}" x2="${w-pad}" y1="${(pad+(h-pad*2)*f).toFixed(1)}" y2="${(pad+(h-pad*2)*f).toFixed(1)}" stroke="#EEF2F7" stroke-width="1"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="height:auto;display:block" role="img" aria-label="Price trend, rising">
    <defs><linearGradient id="agrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4F46E5" stop-opacity="0.22"/><stop offset="1" stop-color="#4F46E5" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#agrad)"/>
    <path d="${line}" fill="none" stroke="#4F46E5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" fill="#4F46E5" stroke="#fff" stroke-width="2"/>
  </svg>`;
}

function actorChip(k){ const a=WF_ACTORS[k]; return `<span class="wf-actor" style="color:${a.c};background:${a.bg}"><span class="d" style="background:${a.c}"></span>${a.name}</span>`; }
function renderFlow(wf){
  return `
  <div class="page">
    ${pageHead(wf.title, wf.desc, `<span class="badge ${wf.phase==='MVP'?'b-verified':'b-info'}">${wf.phase}</span>`)}
    <div class="card" style="margin-bottom:18px">
      <div class="section-title" style="font-size:12px">Actors</div>
      <div class="wf-legend" style="margin-bottom:14px">${wf.actors.map(actorChip).join('')}</div>
      <div style="display:flex;gap:24px;flex-wrap:wrap;border-top:1px solid var(--bd);padding-top:14px">
        <div style="flex:1;min-width:200px"><div class="sub">Trigger</div><b style="font-size:13.5px">${wf.trigger}</b></div>
        <div style="flex:1;min-width:200px"><div class="sub">Outcome</div><b style="font-size:13.5px;color:var(--gn)">${wf.outcome}</b></div>
      </div>
    </div>
    <div class="wf-flow">
      ${wf.steps.map((s,i)=>{ const a=WF_ACTORS[s.actor]; return `
        <div class="wf-step">
          <div class="wf-num" style="background:${a.bg};color:${a.c}">${i+1}</div>
          <div class="wf-card" style="border-left-color:${a.c}">
            <div class="wf-role" style="color:${a.c}">${a.name}</div>
            <div class="wf-act">${s.act}</div>
            <div class="wf-out">${s.out}</div>
          </div>
        </div>`; }).join('')}
    </div>
    <div class="wf-outcome"><span style="font-size:22px">✅</span><div><b style="font-size:13px">Outcome</b><div style="font-size:12.5px;color:var(--sl)">${wf.outcome}</div></div></div>
  </div>`;
}
function wfCard(key){ const wf=WORKFLOWS[key]; return `
  <div class="result-card" style="flex-direction:column;align-items:stretch;gap:9px" data-nav="wf/${key}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <b style="font-size:14px;line-height:1.3">${wf.title}</b>
      <span class="badge ${wf.phase==='MVP'?'b-verified':'b-info'}" style="flex-shrink:0">${wf.phase}</span>
    </div>
    <div style="display:flex;gap:5px;flex-wrap:wrap">${wf.actors.map(a=>`<span class="wf-actor" style="color:${WF_ACTORS[a].c};background:${WF_ACTORS[a].bg};font-size:9.5px;padding:3px 8px"><span class="d" style="width:6px;height:6px;background:${WF_ACTORS[a].c}"></span>${WF_ACTORS[a].name}</span>`).join('')}</div>
    <div style="font-size:12px;color:var(--sl);line-height:1.5"><span style="color:var(--mu)">Trigger:</span> ${wf.trigger}</div>
    <div style="font-size:12px;color:var(--gn);line-height:1.5"><b>→ ${wf.outcome}</b></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px"><span class="sub">${wf.steps.length} steps</span><span class="link" style="font-size:12px">View flow →</span></div>
  </div>`;
}
Object.keys(WORKFLOWS).forEach(k=> S['wf/'+k] = () => renderFlow(WORKFLOWS[k]));

  return `

/* ============ ROUTER ============ */
function renderNav(role){
  const cfg = NAV[role];
  const nav = document.getElementById('sidenav');
  const cur = location.hash.slice(1) || `${role}/${cfg.groups[0].items[0][0].split('/')[1]}`;
  let html = `<div class="nav-role-tag">${cfg.tag}</div>`;
  cfg.groups.forEach(g=>{
    html += `<div class="nav-group-label">${g.label}</div>`;
    g.items.forEach(it=>{
      const [route,ic,label,n] = it;
      html += `<button class="nav-btn ${route===cur?'active':''}" data-nav="${route}"><span class="ic">${ic}</span>${label}${n?`<span class="badge-n">${n}</span>`:''}</button>`;
    });
  });
  html += `<button class="nav-cta" data-nav="${cfg.cta[0]}">＋ ${cfg.cta[1]}</button>`;
  html += `<div class="nav-note">${cfg.note}</div>`;
  nav.innerHTML = html;
}

function roleOf(route){ return route.split('/')[0]; }

function render(){
  let route = location.hash.slice(1);
  if(!S[route]){ route = 'public/home'; }
  const role = roleOf(route);
  // role buttons
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.toggle('active', b.dataset.role===role));
  // avatar + crumb
  const cfg = NAV[role];
  document.getElementById('avatar').textContent = cfg.user[0];
  const nice = route.split('/')[1].replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  const roleName = {public:'Public site',buyer:'Buyer',seller:'Supplier',admin:'Ops / Admin',roadmap:'Roadmap',wf:'Workflows',arch:'Architecture'}[role];
  document.getElementById('crumb').innerHTML = `${roleName}<b>${nice}</b>`;
  renderNav(role);
  const main = document.getElementById('main');
  main.innerHTML = S[route]();
  main.scrollTop = 0;
  wireScreen();
}

function wireScreen(){
  // tab switching (panes)
  document.querySelectorAll('[data-tabgroup]').forEach(group=>{
    group.querySelectorAll('.tab').forEach(tab=>{
      tab.onclick = ()=>{
        group.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.dataset.tab;
        document.querySelectorAll('[data-tabpane]').forEach(p=>{ p.style.display = p.dataset.tabpane===target ? '' : 'none'; });
      };
    });
  });
  // plain filter tabs (no panes) — just toggle active state
  document.querySelectorAll('.tabs:not([data-tabgroup])').forEach(group=>{
    group.querySelectorAll('.tab').forEach(tab=>{
      tab.onclick = ()=>{ group.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active'); };
    });
  });
  // wizard step nav
  const go = (n)=>{
    document.querySelectorAll('[data-wpane]').forEach(p=>p.style.display = p.dataset.wpane===n?'':'none');
    document.querySelectorAll('[data-wstep]').forEach(s=>{
      const sn = s.dataset.wstep;
      s.classList.remove('active','done');
      if(sn<n) s.classList.add('done');
      else if(sn===n) s.classList.add('active');
    });
    document.getElementById('main').scrollTop=0;
  };
  document.querySelectorAll('[data-wgo]').forEach(b=> b.onclick = ()=>go(b.dataset.wgo));

  // live catalog filtering
  if(document.getElementById('catResults')){
    applyCatalogFilters();
    document.querySelectorAll('[data-cat],[data-cert],[data-country],[data-moq]').forEach(inp=> inp.addEventListener('change', applyCatalogFilters));
    const cs = document.getElementById('catSearch');
    cs.addEventListener('input', applyCatalogFilters);
    cs.addEventListener('keydown', e=>{ if(e.key==='Enter') applyCatalogFilters(); });
  }
}

/* nav delegation */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-nav]');
  if(t){ e.preventDefault(); location.hash = t.dataset.nav; }
  const r = e.target.closest('.role-btn');
  if(r){ const role=r.dataset.role; location.hash = `${role}/${NAV[role].groups[0].items[0][0].split('/')[1]}`; }
});

function closeModal(){ document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });

function sendQuote(buyer){
  const price = document.getElementById('qPrice');
  if(!price.value.trim()){ document.getElementById('qPriceErr').style.display='block'; price.focus(); return; }
  closeModal();
  toast(`Quote sent to ${buyer}. They'll be notified by email + WhatsApp.`);
}
function submitRegister(){
  const email = document.getElementById('regEmail');
  const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
  if(!ok){ document.getElementById('regEmailErr').style.display='block'; email.focus(); return; }
  toast('OTP sent to your email & WhatsApp.');
  setTimeout(()=>{ location.hash = 'buyer/onboarding'; }, 700);
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastT); window.__toastT = setTimeout(()=>t.classList.remove('show'), 2600);
}
function acceptQuote(sup){
  openModal(`<button class="x" onclick="closeModal()">×</button><div style="text-align:center;padding:6px 0"><div style="font-size:40px">🤝</div><h3 style="margin-top:8px">Accept quote from ${sup}?</h3>
  <p class="page-sub" style="margin:10px auto 18px">This generates a <b>Deal record + PDF trail</b> (product, qty, price, terms, both parties' verified details), notifies both sides, and alerts ops for a white-glove hand-off. Payment & logistics settle off-platform in the MVP.</p>
  <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="closeModal()">Confirm & generate deal record</button></div>`);
}
function reviewModal(co){
  openModal(`<button class="x" onclick="closeModal()">×</button><h3>Verify — ${co}</h3><p class="page-sub" style="margin:4px 0 16px">Cross-check the submitted documents against issuing authorities.</p>
  <div class="mini-list" style="margin-bottom:16px">
    <div class="mini-item"><span class="dot" style="background:var(--gn)"></span><div><div class="mt">FDA drug database</div><div class="ms">Establishment found · GMP active</div></div></div>
    <div class="mini-item"><span class="dot" style="background:var(--gn)"></span><div><div class="mt">Company existence check</div><div class="ms">GST + CIN validated</div></div></div>
    <div class="mini-item"><span class="dot" style="background:var(--am)"></span><div><div class="mt">Call-back verification</div><div class="ms">Scheduled</div></div></div>
  </div>
  <div class="field"><label>Reason code <span class="hint">required on reject</span></label><select class="select"><option>— select —</option><option>Cert not found at authority</option><option>Expired certificate</option><option>Entity mismatch</option></select></div>
  <div style="display:flex;gap:10px;margin-top:10px"><button class="btn btn-ghost" style="flex:1;justify-content:center;color:var(--rd)" onclick="closeModal()">Reject</button><button class="btn btn-primary" style="flex:1;justify-content:center" onclick="closeModal()">✓ Approve & verify</button></div>`);
}

/* cookie consent (compliance change #2) */
function consent(kind){
  document.getElementById('cookie').classList.remove('show');
  window.__consent = kind;
  toast(kind==='all' ? 'Thanks — analytics enabled.' : 'Saved — essential cookies only.');
}

/* init */
window.addEventListener('hashchange', render);
if(!location.hash) location.hash = 'public/home';
render();
if(!window.__consent) document.getElementById('cookie').classList.add('show');
</script>
