# PharmaLink — one self-contained container (app + embedded SQLite).
#
#   docker compose up --build      # build & run (seeds demo data on first boot)
#   docker compose down            # stop, keep the /data volume (db + uploads)
#   docker compose down -v         # stop and wipe all data
#
# This is the same single image you deploy to Azure Container Apps — see DOCKER.md.

name: pharmalink

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_LOGO_DEV_TOKEN: ${NEXT_PUBLIC_LOGO_DEV_TOKEN:-}
        # Bake demo data into the image's template DB (true) or ship empty (false).
        SEED: ${SEED:-true}
    environment:
      # Auth.js v5 signing secret — REQUIRED. Generate: openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-insecure-secret-change-me-please-32b}
      # Trust the proxy host header (Container Apps terminates TLS upstream).
      AUTH_TRUST_HOST: 'true'
      # The PUBLIC origin Auth.js builds OAuth callbacks from. Behind a tunnel or
      # proxy the request host is the internal one (app:3000 / 0.0.0.0:3000), which
      # would send Google a redirect_uri it can never honour — so pin it explicitly.
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # DATABASE_URL + UPLOAD_DIR default to /data/* inside the image; the volume
      # below makes that path durable.
      # Optional SSO — leave unset to hide those buttons.
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      BOXYHQ_SAML_ISSUER: ${BOXYHQ_SAML_ISSUER:-}
      BOXYHQ_SAML_CLIENT_ID: ${BOXYHQ_SAML_CLIENT_ID:-}
      BOXYHQ_SAML_CLIENT_SECRET: ${BOXYHQ_SAML_CLIENT_SECRET:-}
    volumes:
      # Durable SQLite database + uploaded documents.
      - data:/data
    ports:
      - '${APP_PORT:-3000}:3000'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Public URL for testers. ngrok (not a Cloudflare quick tunnel) because a
  # quick tunnel's hostname belongs to the session, not to you: cloudflared
  # re-registers whenever its control stream drops and Cloudflare hands back a
  # new random *.trycloudflare.com name. That breaks the tester link, AUTH_URL
  # and the Google redirect URI every time. A reserved ngrok domain is fixed.
  #
  # Only starts when NGROK_AUTHTOKEN + NGROK_DOMAIN are set:
  #   docker compose --profile public up -d
  tunnel:
    image: ngrok/ngrok:latest
    profiles: ['public']
    command: http --url=https://${NGROK_DOMAIN:-} app:3000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
