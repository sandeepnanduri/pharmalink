<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PharmaLink">
  <defs>
    <linearGradient id="pl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <clipPath id="pl-cap">
      <rect x="146" y="196" width="220" height="120" rx="60"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#pl-bg)"/>
  <!-- A pharmaceutical capsule: the product this marketplace trades. Pure shapes,
       no font, so it stays sharp at favicon sizes. -->
  <g transform="rotate(-45 256 256)">
    <g clip-path="url(#pl-cap)">
      <rect x="146" y="196" width="110" height="120" fill="#ffffff"/>
      <rect x="256" y="196" width="110" height="120" fill="#CFFAFE"/>
    </g>
    <line x1="256" y1="198" x2="256" y2="314" stroke="#0891B2" stroke-width="8" stroke-opacity="0.45"/>
    <rect x="146" y="196" width="220" height="120" rx="60" fill="none" stroke="#0E7490" stroke-opacity="0.18" stroke-width="6"/>
  </g>
</svg>
